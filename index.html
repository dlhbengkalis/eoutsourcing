    api('apiAuditList', f).then(function (r) {
      data = r.rows;
      $('#res').innerHTML = '<small class="muted">' + r.total + ' catatan' + (r.total > data.length ? ' (ditampilkan ' + data.length + ' terbaru)' : '') + '</small>' +
        tbl(HD, rowsOf().map(function (x) { return '<tr>' + x.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }), 'Tidak ada catatan pada filter ini.');
    }).catch(onErr);
  }
  $('#a_go').onclick = load;
  $('#exx').onclick = function () { downloadXlsx('audit_log_' + f.dari + '_' + f.sampai + '.xlsx', 'Audit', HD, rowsOf()); };
  load();
}

/* ---------- pengaturan ---------- */
function aSetting() {
  api('apiPengaturanGet').then(function (d) {
    var s = d.setting;
    var hk = String(s.hari_kerja).split(',').map(function (x) { return x.trim(); });
    var days = [['1', 'Sen'], ['2', 'Sel'], ['3', 'Rab'], ['4', 'Kam'], ['5', 'Jum'], ['6', 'Sab'], ['7', 'Min']];
    var lines = function (k) { return esc(listOpt(s[k]).join('\n')); };
    var h = '<h2>Pengaturan</h2>' +
      '<form id="sf">' +
      '<div class="card"><h3>Jam kerja & aturan presensi</h3><div class="grid">' +
      frow('Jam masuk', '<input name="jam_masuk" type="time" value="' + esc(s.jam_masuk) + '">') + frow('Toleransi terlambat (menit)', '<input name="toleransi_menit" type="number" min="0" value="' + esc(s.toleransi_menit) + '">') +
      frow('Jam pulang paling awal', '<input name="jam_pulang" type="time" value="' + esc(s.jam_pulang) + '">') + frow('Akurasi GPS maks. (meter)', '<input name="maks_akurasi_m" type="number" min="10" value="' + esc(s.maks_akurasi_m) + '">') +
      frow('Tolak presensi di luar radius lokasi kerja', '<select name="wajib_radius"><option' + (s.wajib_radius === 'TIDAK' ? ' selected' : '') + '>TIDAK</option><option' + (s.wajib_radius === 'YA' ? ' selected' : '') + '>YA</option></select>') +
      frow('Tandai foto lebih tua dari (menit)', '<input name="maks_selisih_foto_menit" type="number" min="1" value="' + esc(s.maks_selisih_foto_menit) + '">') +
      frow('Laporan wajib setelah presensi masuk', '<select name="laporan_wajib_hadir"><option' + (s.laporan_wajib_hadir === 'YA' ? ' selected' : '') + '>YA</option><option' + (s.laporan_wajib_hadir === 'TIDAK' ? ' selected' : '') + '>TIDAK</option></select>') +
      frow('Minimum foto per laporan (0-3)', '<input name="laporan_min_foto" type="number" min="0" max="3" value="' + esc(s.laporan_min_foto) + '">') +
      frow('Laporan wajib memuat volume pekerjaan', '<select name="laporan_wajib_volume"><option' + (s.laporan_wajib_volume === 'TIDAK' ? ' selected' : '') + '>TIDAK</option><option' + (s.laporan_wajib_volume === 'YA' ? ' selected' : '') + '>YA</option></select>') +
      '<div class="full"><label>Hari kerja</label><div class="row">' + days.map(function (d) { return '<label style="margin:0;font-weight:500"><input type="checkbox" class="hk" value="' + d[0] + '"' + (hk.indexOf(d[0]) >= 0 ? ' checked' : '') + '> ' + d[1] + '</label>'; }).join('') + '</div></div>' +
      '<div class="full">' + frow('Tanggal libur / cuti bersama (yyyy-mm-dd, pisahkan koma)', '<textarea name="hari_libur" style="min-height:60px">' + esc(s.hari_libur) + '</textarea>') + '<small class="muted">Perbarui setiap tahun sesuai SKB hari libur nasional dan cuti bersama yang berlaku.</small></div>' +
      '</div></div>' +
      '<div class="card"><h3>Daftar pilihan (satu per baris)</h3><div class="grid">' +
      frow('Jenis pekerjaan', '<textarea name="jenis_pekerjaan" style="min-height:150px">' + lines('jenis_pekerjaan') + '</textarea>') + frow('Kategori tenaga', '<textarea name="kategori" style="min-height:150px">' + lines('kategori') + '</textarea>') +
      frow('Bidang / penempatan', '<textarea name="bidang" style="min-height:150px">' + lines('bidang') + '</textarea>') + frow('Pendidikan', '<textarea name="pddk" style="min-height:150px">' + lines('pddk') + '</textarea>') + frow('Satuan volume pekerjaan', '<textarea name="satuan" style="min-height:150px">' + lines('satuan') + '</textarea>') +
      '</div></div>' +
      '<div class="card"><h3>Keamanan</h3><small class="muted">PIN awal tenaga dibuat acak dan berbeda untuk setiap tenaga (saat tambah, impor, atau reset), ditampilkan satu kali kepada admin, dan wajib diganti saat login pertama.</small></div>' +
      '<button class="btn btn-primary btn-lg btn-block">Simpan pengaturan</button></form>' +
      '<div class="card mt"><h3>Lokasi kerja (geofence)</h3><p class="muted" style="margin-top:0">Jika diisi, jarak presensi dihitung ke lokasi terdekat. Presensi di luar radius diberi tanda ⚠️ (atau ditolak bila opsi di atas = YA). Kosongkan bila petugas bekerja berpindah-pindah (mis. penyapuan jalan).</p><div id="lok"></div><div class="row mt"><button class="btn btn-sm" id="la">+ Tambah lokasi</button><button class="btn btn-sm" id="lg">📍 Isi dari lokasi saya</button><span class="spacer"></span><button class="btn btn-primary btn-sm" id="ls">Simpan lokasi</button></div></div>' +
      '<div class="card"><h3>Jadwal / shift khusus</h3><p class="muted" style="margin-top:0">Atur jam kerja, toleransi, dan hari kerja yang berbeda untuk kategori atau bidang tertentu (mis. pengangkutan sampah mulai pagi, satpam shift malam). Kolom kosong = ikut pengaturan umum di atas. Bila kategori dan bidang sama-sama diisi, jadwal itu yang diprioritaskan. Pilih "Lintas hari = YA" untuk shift yang pulangnya melewati tengah malam. Jadwal juga dapat dibatasi ke lokasi kerja tertentu (geofence), menimpa kewajiban radius, dan memiliki hari libur tambahan sendiri (libur umum tetap berlaku untuk semua jadwal).</p><div id="jad"></div><div class="row mt"><button class="btn btn-sm" id="ja">+ Tambah jadwal</button><span class="spacer"></span><button class="btn btn-primary btn-sm" id="js">Simpan jadwal</button></div></div>' +
      '<div class="card"><h3>Akun admin</h3><div id="adm"></div><div class="row mt"><button class="btn btn-sm" id="aa">+ Tambah admin</button><button class="btn btn-sm" id="ap">Ganti password saya</button></div></div>';
    $('#view').innerHTML = h;

    $('#sf').onsubmit = function (e) {
      e.preventDefault();
      var v = formVals($('#sf'));
      ['jenis_pekerjaan', 'kategori', 'bidang', 'pddk', 'satuan'].forEach(function (k) { v[k] = v[k].split('\n').map(function (x) { return x.trim().replace(/;/g, ','); }).filter(String).join(';'); });
      v.hari_kerja = $$('.hk:checked').map(function (x) { return x.value; }).join(',');
      v.hari_libur = v.hari_libur.replace(/\s+/g, '');
      busy(function () { return api('apiPengaturanSimpan', v); }).then(function () { toast('Pengaturan disimpan.', 'ok'); return api('apiBootstrap'); })
        .then(function (b) { S.cfg = b.cfg; S.opsi = b.opsi; }).catch(onErr);
    };

    var lok = d.lokasi.slice();
    function drawLok() {
      $('#lok').innerHTML = lok.length ? lok.map(function (l, i) {
        return '<div class="lokrow"><div><label>Nama</label><input data-k="nama" data-i="' + i + '" value="' + esc(l.nama) + '"></div>' +
          '<div><label>Lat</label><input data-k="lat" data-i="' + i + '" value="' + esc(l.lat) + '"></div><div><label>Lng</label><input data-k="lng" data-i="' + i + '" value="' + esc(l.lng) + '"></div>' +
          '<div><label>Radius (m)</label><input data-k="radius_m" data-i="' + i + '" value="' + esc(l.radius_m) + '"></div><button class="btn btn-sm btn-danger" data-x="' + i + '">✕</button></div>';
      }).join('') : '<small class="muted">Belum ada lokasi — geofence tidak aktif.</small>';
      $$('#lok input').forEach(function (inp) { inp.oninput = function () { lok[+inp.getAttribute('data-i')][inp.getAttribute('data-k')] = inp.value; }; });
      $$('#lok [data-x]').forEach(function (b) { b.onclick = function () { lok.splice(+b.getAttribute('data-x'), 1); drawLok(); }; });
    }
    drawLok();
    $('#la').onclick = function () { lok.push({ nama: '', lat: '', lng: '', radius_m: 100 }); drawLok(); };
    $('#lg').onclick = function () {
      if (!navigator.geolocation) { toast('Browser tidak mendukung GPS.', 'err'); return; }
      loading(true, 'Mencari lokasi…');
      navigator.geolocation.getCurrentPosition(function (p) { loading(false); lok.push({ nama: 'Lokasi baru', lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6), radius_m: 100 }); drawLok(); },
        function () { loading(false); toast('Lokasi tidak dapat diambil. Isi koordinat secara manual.', 'err'); }, { enableHighAccuracy: true, timeout: 20000 });
    };
    $('#ls').onclick = function () { busy(function () { return api('apiLokasiSimpan', lok); }).then(function () { toast('Lokasi tersimpan.', 'ok'); return api('apiBootstrap'); }).then(function (b) { S.cfg = b.cfg; }).catch(onErr); };

    var jad = (d.jadwal || []).map(function (x) { return Object.assign({}, x); });
    var kats = listOpt(s.kategori), bids = listOpt(s.bidang);
    var lokNames = (d.lokasi || []).map(function (l) { return l.nama; }).filter(String);
    function drawJad() {
      $('#jad').innerHTML = jad.length ? jad.map(function (x, i) {
        var hkj = String(x.hari_kerja || '').split(',');
        var lkj = String(x.lokasi || '').split(';');
        var at = ' data-i="' + i + '"';
        return '<div class="card" style="background:#f7faf8"><div class="grid">' +
          frow('Nama jadwal', '<input data-k="nama"' + at + ' value="' + esc(x.nama) + '">') +
          frow('Kategori (kosong = semua)', '<select data-k="kategori"' + at + '>' + optsHtml(kats, x.kategori, '— semua —') + '</select>') +
          frow('Bidang (kosong = semua)', '<select data-k="bidang"' + at + '>' + optsHtml(bids, x.bidang, '— semua —') + '</select>') +
          frow('Jam masuk', '<input type="time" data-k="jam_masuk"' + at + ' value="' + esc(x.jam_masuk) + '">') +
          frow('Jam pulang paling awal', '<input type="time" data-k="jam_pulang"' + at + ' value="' + esc(x.jam_pulang) + '">') +
          frow('Toleransi terlambat (menit)', '<input type="number" min="0" data-k="toleransi_menit"' + at + ' value="' + esc(x.toleransi_menit) + '">') +
          frow('Lintas hari (pulang melewati tengah malam)', '<select data-k="lintas_hari"' + at + '><option value="">TIDAK</option><option value="YA"' + (x.lintas_hari === 'YA' ? ' selected' : '') + '>YA</option></select>') +
          '<div class="full"><label>Lokasi kerja yang berlaku (kosongkan semua = semua lokasi)</label><div class="row">' + (lokNames.length ? lokNames.map(function (ln) { return '<label style="margin:0;font-weight:500"><input type="checkbox" class="jlk"' + at + ' value="' + esc(ln) + '"' + (lkj.indexOf(ln) >= 0 ? ' checked' : '') + '> ' + esc(ln) + '</label>'; }).join('') : '<small class="muted">Belum ada lokasi kerja tersimpan.</small>') + '</div></div>' +
          frow('Wajib berada dalam radius lokasi', '<select data-k="wajib_radius"' + at + '><option value="">Ikut pengaturan umum</option><option value="YA"' + (x.wajib_radius === 'YA' ? ' selected' : '') + '>YA (tolak di luar radius)</option><option value="TIDAK"' + (x.wajib_radius === 'TIDAK' ? ' selected' : '') + '>TIDAK (hanya tandai ⚠️)</option></select>') +
          '<div class="full">' + frow('Hari libur khusus jadwal ini (yyyy-mm-dd, pisahkan koma; ditambahkan ke libur umum)', '<textarea data-k="hari_libur"' + at + ' style="min-height:50px">' + esc(x.hari_libur) + '</textarea>') + '</div>' +
          '<div class="full"><label>Hari kerja (kosongkan semua = ikut pengaturan umum)</label><div class="row">' + days.map(function (dd) { return '<label style="margin:0;font-weight:500"><input type="checkbox" class="jhk"' + at + ' value="' + dd[0] + '"' + (hkj.indexOf(dd[0]) >= 0 ? ' checked' : '') + '> ' + dd[1] + '</label>'; }).join('') + '</div></div>' +
          '</div><button class="btn btn-sm btn-danger" data-jx="' + i + '">Hapus jadwal</button></div>';
      }).join('') : '<small class="muted">Belum ada jadwal khusus — semua tenaga memakai pengaturan umum.</small>';
      $$('#jad [data-k]').forEach(function (inp) { inp.oninput = inp.onchange = function () { jad[+inp.getAttribute('data-i')][inp.getAttribute('data-k')] = inp.value; }; });
      $$('#jad .jlk').forEach(function (cb) { cb.onchange = function () { var i = +cb.getAttribute('data-i'); jad[i].lokasi = $$('#jad .jlk[data-i="' + i + '"]:checked').map(function (c) { return c.value; }).join(';'); }; });
      $$('#jad .jhk').forEach(function (cb) { cb.onchange = function () { var i = +cb.getAttribute('data-i'); jad[i].hari_kerja = $$('#jad .jhk[data-i="' + i + '"]:checked').map(function (c) { return c.value; }).join(','); }; });
      $$('#jad [data-jx]').forEach(function (b) { b.onclick = function () { jad.splice(+b.getAttribute('data-jx'), 1); drawJad(); }; });
    }
    drawJad();
    $('#ja').onclick = function () { jad.push({ nama: '', kategori: '', bidang: '', jam_masuk: '', jam_pulang: '', toleransi_menit: '', hari_kerja: '', lintas_hari: '', lokasi: '', wajib_radius: '', hari_libur: '' }); drawJad(); };
    $('#js').onclick = function () { busy(function () { return api('apiJadwalSimpan', jad); }).then(function () { toast('Jadwal tersimpan.', 'ok'); }).catch(onErr); };

    $('#adm').innerHTML = '<small class="muted">SUPER: semua fitur. VERIFIKATOR: melihat data, memverifikasi/mengoreksi presensi dan laporan. VIEWER: hanya melihat dan mengekspor. Perubahan peran berlaku pada tindakan berikutnya.</small>' + tbl(['Username', 'Nama', 'Peran', 'Status', ''], d.admins.map(function (a) {
      return '<tr><td>' + esc(a.username) + '</td><td>' + esc(a.nama) + '</td><td>' + esc(a.peran) + '</td><td>' + esc(a.status) + '</td><td><button class="btn btn-sm" data-ea="' + esc(a.username) + '">Ubah</button></td></tr>';
    }));
    $$('#adm [data-ea]').forEach(function (b) { b.onclick = function () { adminForm(d.admins.filter(function (a) { return a.username === b.getAttribute('data-ea'); })[0]); }; });
    $('#aa').onclick = function () { adminForm(null); };
    $('#ap').onclick = pwForm;
  }).catch(onErr);
}

function pwForm() {
  var m = openModal('Ganti password saya', '<form id="gp"><label>Password lama</label><input name="a" type="password" required><label>Password baru (min. 8 karakter)</label><input name="b" type="password" required><label>Ulangi password baru</label><input name="c" type="password" required><button class="btn btn-primary btn-block mt">Simpan</button></form>');
  $('#gp', m.el).onsubmit = function (e) {
    e.preventDefault(); var v = formVals(m.el);
    if (v.b !== v.c) { toast('Konfirmasi tidak sama.', 'err'); return; }
    busy(function () { return api('apiGantiPassword', v.a, v.b); }).then(function () { m.close(); toast('Password diganti.', 'ok'); }).catch(onErr);
  };
}

function adminForm(a) {
  var baru = !a; a = a || { status: 'Aktif', peran: 'VIEWER' };
  var m = openModal(baru ? 'Tambah admin' : 'Ubah admin',
    '<form id="af"><label>Username</label><input name="username" value="' + esc(a.username) + '"' + (baru ? '' : ' readonly') + ' required><label>Nama</label><input name="nama" value="' + esc(a.nama) + '" required>' +
    '<label>' + (baru ? 'Password (min. 8 karakter)' : 'Password baru (kosongkan bila tidak diubah)') + '</label><input name="password" type="password"' + (baru ? ' required' : '') + '>' +
    '<label>Peran</label><select name="peran">' + ['SUPER', 'VERIFIKATOR', 'VIEWER'].map(function (x) { return '<option' + (a.peran === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
    '<label>Status</label><select name="status"><option' + (a.status === 'Aktif' ? ' selected' : '') + '>Aktif</option><option' + (a.status === 'Nonaktif' ? ' selected' : '') + '>Nonaktif</option></select>' +
    '<button class="btn btn-primary btn-block mt">Simpan</button></form>');
  $('#af', m.el).onsubmit = function (e) {
    e.preventDefault();
    busy(function () { return api('apiAdminSimpan', formVals(m.el)); }).then(function () { m.close(); toast('Tersimpan.', 'ok'); aSetting(); }).catch(onErr);
  };
}

/* ============================================================
 * Mulai
 * ========================================================== */
/* Pengaman lebar: bila area tampilan lebih lebar dari layar HP (terjadi pada sebagian iOS/Safari
 * di dalam iframe Apps Script), kunci lebar halaman sebesar lebar layar fisik agar tidak terpotong. */
function fitW() {
  try {
    var de = document.documentElement, sw = Math.min(screen.width || 9999, screen.height || 9999);
    var iw = de.clientWidth || innerWidth;
    var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    var W = (touch && sw <= 600 && iw > sw + 2 && innerHeight >= iw * 0.9) ? sw : 0;
    de.style.setProperty('--vw', W ? W + 'px' : '100%');
    de.classList.toggle('vwfix', !!W);
  } catch (e) {}
}
fitW(); addEventListener('resize', fitW); addEventListener('orientationchange', function () { setTimeout(fitW, 350); });

var saved = store('eo_token');
if (saved) { S.token = saved; boot(); } else renderLogin();

})();
</script>
